name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://qa_platform:qa_platform_ci_password@localhost:5432/qa_intelligence_platform_test?schema=public
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  LOG_LEVEL: error
  NODE_ENV: test
  AUTH_SECRET: ci-only-secret-value-not-used-in-any-real-environment
  ANTHROPIC_API_KEY: ci-only-dummy-key-never-used-for-a-real-request

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qa_platform
          POSTGRES_PASSWORD: qa_platform_ci_password
          POSTGRES_DB: qa_intelligence_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Seed database
        run: npm run db:seed

      - name: Unit + integration tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # E2E runs separately (heavier, browsers to install) — wired up once
      # there's a real flow worth gating merges on beyond Phase 1's shell.
      # - name: Install Playwright browsers
      #   run: npx playwright install --with-deps
      # - name: E2E tests
      #   run: npm run test:e2e
